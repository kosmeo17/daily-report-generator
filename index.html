<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: #f5f4f0;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .container { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  header h1 { font-size: 22px; font-weight: 700; color: #111; }
  header p { font-size: 13px; color: #888; margin-top: 4px; }
  .date-bar { font-size: 13px; color: #555; margin-top: 8px; font-weight: 500; }

  .section {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 14px;
    border: 1px solid #e8e6e0;
  }

  .section-title {
    font-size: 15px; font-weight: 600; color: #111;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }

  .section-title-text { display: flex; align-items: center; gap: 8px; }

  .template-btn {
    margin-left: auto;
    border: 1px solid #e4e2dc;
    background: #faf9f7;
    color: #555;
    border-radius: 999px;
    padding: 4px 10px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .template-btn:hover { border-color: #bbb; background: #fff; color: #111; }

  textarea {
    width: 100%;
    border: 1.5px solid #e4e2dc;
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px; color: #222;
    background: #faf9f7;
    resize: vertical; outline: none;
    transition: border-color 0.2s;
    line-height: 1.7;
    min-height: 100px;
  }
  textarea:focus { border-color: #3b82f6; background: #fff; }
  textarea::placeholder { color: #bbb; font-size: 13px; }

  .btn-row {
    display: flex; gap: 10px; margin-top: 6px; justify-content: flex-end;
  }

  .btn-generate {
    background: #1a1a1a; color: #fff; border: none;
    border-radius: 8px; padding: 11px 22px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; gap: 6px;
  }
  .btn-generate:hover { background: #333; transform: translateY(-1px); }
  .btn-generate:disabled { background: #999; transform: none; cursor: not-allowed; }

  .btn-secondary {
    background: #fff; color: #333;
    border: 1.5px solid #ddd; border-radius: 8px;
    padding: 11px 18px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px; cursor: pointer;
    transition: all 0.2s; display: none;
  }
  .btn-secondary:hover { border-color: #aaa; background: #f8f8f8; }

  .output-section {
    background: #fff;
    border-radius: 12px;
    padding: 0;
    margin-top: 20px;
    display: none;
    animation: fadeIn 0.3s ease;
    overflow: hidden;
  }
  .output-section.visible { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .output-topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px;
    background: #f8f7f4;
    border-bottom: 1px solid #e8e6e0;
  }

  .output-topbar span {
    font-size: 12px; color: #888; font-family: monospace; letter-spacing: 0.3px;
  }

  .copy-btn-inline {
    background: #3b82f6; color: #fff; border: none;
    border-radius: 6px; padding: 5px 14px;
    font-size: 12px; cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    transition: background 0.2s;
  }
  .copy-btn-inline:hover { background: #2563eb; }

  .output-body {
    font-size: 13.5px;
    line-height: 1.9;
    color: #1f2933;
    word-break: break-word;
    padding: 20px 22px;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .output-body h1 { font-size: 18px; margin-bottom: 18px; }
  .output-body h2 { font-size: 16px; margin: 18px 0 8px; }
  .output-body ol { padding-left: 22px; margin: 0 0 10px; }
  .output-body li { margin: 4px 0; }
  .output-body .sub-list { list-style-type: lower-alpha; margin-top: 4px; }
  .output-body .third-list { list-style-type: lower-roman; margin-top: 4px; }

  .suggestion-section {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 12px;
    padding: 18px 20px;
    margin-top: 14px;
    display: none;
  }
  .suggestion-section.visible { display: block; }
  .suggestion-section h2 {
    font-size: 15px;
    margin-bottom: 10px;
    color: #9a3412;
  }
  .suggestion-section ol {
    padding-left: 22px;
    line-height: 1.8;
    color: #7c2d12;
    font-size: 13.5px;
  }

  /* Syntax highlighting for markdown */
  .md-heading { color: #569cd6; font-weight: bold; }
  .md-bold { color: #ce9178; }
  .md-bullet { color: #6a9955; }

  .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1a1a; color: #fff;
    padding: 10px 20px; border-radius: 8px;
    font-size: 13px; opacity: 0;
    transition: all 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  .modal.visible { display: flex; }
  .modal-content {
    max-width: min(920px, 96vw);
    max-height: 90vh;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    font-weight: 600;
  }
  .modal-close {
    border: none;
    background: transparent;
    font-size: 20px;
    cursor: pointer;
    color: #666;
  }
  .modal img {
    display: block;
    max-width: 100%;
    max-height: calc(90vh - 50px);
    object-fit: contain;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📋 日报生成器</h1>
    <div class="date-bar" id="dateBar"></div>
  </header>

  <div class="section">
    <div class="section-title">
      <div class="section-title-text"><span>💼</span> 今日工作内容</div>
      <button class="template-btn" onclick="openTemplateModal()">模板示例</button>
    </div>
    <textarea id="input-work" placeholder="支持：大段文字直接粘贴；并列事项用分号；上下级用缩进或 1/a/i。&#10;&#10;层级示例：&#10;1. 需求验收&#10;   a. 海外三方支付提示 - 增加&#10;      i. 避免客诉时无证据&#10;   b. 中国安卓支付链路优化" rows="7"></textarea>
  </div>

  <div class="section">
    <div class="section-title"><span>📅</span> 明日计划</div>
    <textarea id="input-plan" placeholder="建议写明：明日重点、预期产出、需要协同或拍板的事项" rows="4"></textarea>
  </div>

  <div class="section">
    <div class="section-title"><span>💡</span> 思考 / 问题（选填）</div>
    <textarea id="input-thoughts" placeholder="建议写明：业务判断、风险卡点、需要老板关注或决策的事项" rows="3"></textarea>
  </div>

  <div class="btn-row">
    <button class="btn-generate" id="btnGenerate" onclick="generate()">
      <span id="btnText">✨ 生成日报</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </div>

  <div class="suggestion-section" id="suggestionSection">
    <h2>可补充信息&建议</h2>
    <ol id="suggestionList"></ol>
  </div>

  <div class="output-section" id="outputSection">
    <div class="output-topbar">
      <span id="outputFilename">日报.md</span>
      <button class="copy-btn-inline" onclick="copyMd()">复制到飞书</button>
    </div>
    <div class="output-body" id="outputBody"></div>
  </div>
</div>

<div class="toast" id="toast">✓ 已复制，可粘贴到飞书</div>
<div class="modal" id="templateModal" onclick="closeTemplateModal(event)">
  <div class="modal-content">
    <div class="modal-topbar">
      <span>日报模板示例</span>
      <button class="modal-close" onclick="closeTemplateModal()">×</button>
    </div>
    <img src="assets/template-example.png" alt="日报模板示例">
  </div>
</div>

<script>
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  const dateStr = `${y}.${m}.${d}`;
  document.getElementById('dateBar').textContent = dateStr;
  document.getElementById('outputFilename').textContent = `日报_${y}${m}${d}.md`;

  let rawMd = '';

  function splitLines(text) {
    return text
      .split(/\n+/)
      .map(line => line.replace(/\s+$/, ''))
      .filter(line => line.trim());
  }

  function stripListPrefix(line) {
    return line.trimStart().replace(/^([一二三四五六七八九十]+[\.\、．]|[ivxlcdm]+[\.\、)]|\d+[\.\、)]|[a-zA-Z][\.\、)]|[-*•◦○●])\s*/i, '').trim();
  }

  function isSubItemLine(line) {
    return /^([a-zA-Z][\.\、)]|[-*])\s+/.test(line.trimStart());
  }

  function isThirdItemLine(line) {
    return /^(i{1,3}|iv|v|vi{0,3}|ix|x)[\.\、)]\s+/i.test(line.trimStart());
  }

  function isMainItemLine(line) {
    return /^\d+[\.\、]\s+/.test(line.trimStart());
  }

  function isModuleLine(line) {
    const cleanLine = line.trim();
    return cleanLine.length <= 20 && /(业务|项目|模块)$/.test(cleanLine);
  }

  function hasListMarker(line) {
    return getMarkerType(line) !== 'text';
  }

  function splitFreeformLine(line) {
    const trimmed = line.trim();

    if (!trimmed || hasListMarker(line) || isModuleLine(trimmed) || trimmed.length < 45) {
      return [line];
    }

    return trimmed
      .replace(/([。；;])\s*/g, '$1\n')
      .replace(/，(?=(同时|另外|此外|后续|今天|明天|然后|并且|发现|输出|完成|跟进|沟通|同步|整理|Review|review))/g, '\n')
      .split('\n')
      .map(item => item.trim().replace(/[。；;]$/, ''))
      .filter(Boolean);
  }

  function expandFreeformLines(lines) {
    return lines.flatMap(splitFreeformLine);
  }

  function formatSectionTitle(name) {
    const cleanName = name.replace(/^【|】$/g, '');
    return `**【${cleanName}】**`;
  }

  function highlightText(text) {
    return text;
  }

  function capitalizeEnglishNames(text) {
    const protectedWords = new Set([
      'AI', 'API', 'CEO', 'CPM', 'GEO', 'GMV', 'KOC', 'KPI', 'LTV', 'OKR',
      'SEO', 'SKU', 'TA', 'VIP'
    ]);

    return text.replace(/\b[A-Za-z][A-Za-z'-]*\b/g, word => {
      const upperWord = word.toUpperCase();
      if (protectedWords.has(upperWord)) return upperWord;
      if (word.length <= 2) return word;
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    });
  }

  function polishText(text) {
    const normalized = text
      .replace(/\bpaywall\b/gi, 'Paywall')
      .replace(/\bsku\b/gi, 'SKU')
      .replace(/\bltv\b/gi, 'LTV')
      .replace(/\bapp\s*store\b/gi, 'App Store')
      .replace(/\bseo\b/gi, 'SEO')
      .replace(/\bgeo\b/gi, 'GEO')
      .replace(/\breview\b/gi, 'Review')
      .replace(/\s*([，。；：、])\s*/g, '$1')
      .replace(/([A-Za-z0-9])([\u4e00-\u9fa5])/g, '$1 $2')
      .replace(/([\u4e00-\u9fa5])([A-Za-z0-9])/g, '$1 $2')
      .replace(/\s+/g, ' ')
      .trim();

    return capitalizeEnglishNames(normalized);
  }

  function formatItem(line) {
    const cleanLine = polishText(stripListPrefix(line));
    const match = cleanLine.match(/^(.{2,24}?)(：|:(?!\/\/))\s*(.+)$/);

    if (match) {
      return `**${match[1]}**：${highlightText(match[3])}`;
    }

    return highlightText(cleanLine);
  }

  function createWorkItem(line) {
    return {
      text: stripListPrefix(line),
      subItems: []
    };
  }

  function createSubItem(line) {
    return {
      text: stripListPrefix(line),
      children: []
    };
  }

  function getIndentLevel(line) {
    const match = line.match(/^[\t ]*/);
    return (match?.[0] || '').replace(/\t/g, '    ').length;
  }

  function getMarkerType(line) {
    const trimmed = line.trimStart();
    if (/^[一二三四五六七八九十]+[\.\、．]\s*/.test(trimmed)) return 'chinese';
    if (/^(i{1,3}|iv|v|vi{0,3}|ix|x)[\.\、)]\s+/i.test(trimmed)) return 'roman';
    if (/^\d+[\.\、)]\s+/.test(trimmed)) return 'number';
    if (/^[a-zA-Z][\.\、)]\s+/.test(trimmed)) return 'alpha';
    if(/^[-*•◦○●]\s+/.test(trimmed)) return 'bullet';
    return 'text';
  }

  function getIndentedLevel(indentLevel, indentLevels) {
    if (indentLevel <= 0) return 0;

    const exactIndex = indentLevels.indexOf(indentLevel);
    if (exactIndex >= 0) return exactIndex + 1;

    const deeperCount = indentLevels.filter(level => level < indentLevel).length;
    indentLevels.splice(deeperCount, 0, indentLevel);
    return deeperCount + 1;
  }

  function getFallbackLevel(line, cleanLine, state) {
    const markerType = getMarkerType(line);

    if (markerType === 'chinese') {
      state.usesChineseTopLevel = true;
      return 0;
    }

    if (state.usesChineseTopLevel) {
      if (markerType === 'number') return 1;
      if (markerType === 'alpha' || markerType === 'roman') return 2;
    }

    if (markerType === 'alpha') return state.hasMainItem ? 1 : 0;
    if (markerType === 'roman') return state.hasSubItem ? 2 : 1;
    if (markerType === 'bullet') return state.hasMainItem ? 1 : 0;

    if (markerType === 'number' && shouldNestNumberedLine(cleanLine, state.currentMainItem)) {
      return 1;
    }

    return 0;
  }

  function createNode(text) {
    return {
      text: stripListPrefix(text),
      children: []
    };
  }

  function shouldForceMainItem(cleanLine) {
    return /^(沟通|付费入口|AppStore|618|数据|review|Review|曝光帖文|VIP|Coins)/.test(cleanLine);
  }

  function shouldNestNumberedLine(cleanLine, currentItem) {
    if (!currentItem) return false;
    if (shouldForceMainItem(cleanLine)) return false;
    if (/[:：]$/.test(currentItem.text)) return true;
    return /^(核心表现|整理|同步|组内|由于|今日|短期|长期|复购|完成|已知|已完成|已同步|已处理|预计|反馈|审阅)/.test(cleanLine);
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderInline(text) {
    return escapeHtml(text)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  }

  function renderMarkdown(md) {
    const lines = md.split('\n');
    let html = '';
    const listStack = [];

    function listAttr(depth) {
      if (depth === 1) return ' type="a"';
      if (depth >= 2) return ' type="i"';
      return '';
    }

    function openList(depth) {
      html += `<ol${listAttr(depth)}>`;
      listStack.push({ liOpen: false });
    }

    function closeList() {
      const list = listStack.pop();
      if (!list) return;
      if (list.liOpen) html += '</li>';
      html += '</ol>';
    }

    function closeLists() {
      while (listStack.length) closeList();
    }

    function addListItem(depth, content) {
      while (listStack.length > depth + 1) closeList();

      while (listStack.length < depth + 1) {
        openList(listStack.length);
      }

      const currentList = listStack[depth];
      if (currentList.liOpen) html += '</li>';

      html += `<li>${renderInline(content)}`;
      currentList.liOpen = true;
    }

    lines.forEach(line => {
      if (!line.trim()) return;

      if (line.startsWith('# ')) {
        closeLists();
        html += `<h1>${renderInline(line.slice(2))}</h1>`;
        return;
      }

      if (line.startsWith('## ')) {
        closeLists();
        html += `<h2>${renderInline(line.slice(3))}</h2>`;
        return;
      }

      const thirdMatch = line.match(/^\s{6}(?:i{1,3}|iv|v|vi{0,3}|ix|x)\.\s+(.*)$/i);
      if (thirdMatch) {
        addListItem(2, thirdMatch[1]);
        return;
      }

      const subMatch = line.match(/^\s+[a-z]\.\s+(.*)$/);
      if (subMatch) {
        addListItem(1, subMatch[1]);
        return;
      }

      const mainMatch = line.match(/^\d+\.\s+(.*)$/);
      if (mainMatch) {
        addListItem(0, mainMatch[1]);
        return;
      }

      closeLists();
      html += `<p>${renderInline(line)}</p>`;
    });

    closeLists();
    return html;
  }

  function hasSpecificMetric(text, keywords) {
    const hasKeyword = keywords.some(keyword => text.includes(keyword));
    const hasMetric = /(\d+(?:\.\d+)?\s*(%|pp|百分点|万|人|单|元|¥|￥)|[Xx]\s*个|多少|量级)/.test(text);
    return hasKeyword && hasMetric;
  }

  function buildSuggestions(work, plan, thoughts) {
    const content = `${work}\n${plan}\n${thoughts}`;
    const suggestions = [];
    const hasThoughts = Boolean(thoughts.trim());
    const hasRichWork = splitLines(work).length >= 4;

    if (/(Paywall|paywall|支付率|调起支付|实际支付率)/.test(content) && !hasSpecificMetric(content, ['Paywall', 'paywall', '支付率', '调起支付', '实际支付率'])) {
      suggestions.push('Paywall / 支付率相关内容可以补充具体数字，例如“近 6 个月下降 X 个百分点”或“影响到哪个入口 / SKU”。');
    }

    if (/618|活动/.test(content) && !/(收入|新增|GMV|拉动|影响|预估|预计).*(\d|多少|X)/i.test(content)) {
      suggestions.push('618 活动可以补充预期业务影响，例如预计拉动多少新增收入、影响哪些用户或上线后的观察指标。');
    }

    if (/(Coins|coins|补发|推送异常|未收到)/.test(content) && !/(用户|人数|量级|覆盖|影响).*(\d|多少|X)/i.test(content)) {
      suggestions.push('Coins 补发或推送异常可以补充影响用户量级，例如影响多少用户、补发覆盖范围、是否还有遗留风险。');
    }

    if (/(异常|风险|阻塞|下滑|失败|未收到)/.test(content) && !/(下一步|后续|已处理|解决方案|负责人|时间点|预计)/.test(content)) {
      suggestions.push('涉及异常或风险时，建议补充处理状态、负责人、下一步和预计完成时间，降低老板追问成本。');
    }

    if (thoughts && !/(建议|需要|拍板|决策|风险|判断|原因|方案)/.test(thoughts)) {
      suggestions.push('思考 / 问题部分可以补充你的判断或建议动作，让它更像向上管理信息，而不只是记录问题。');
    }

    if (!hasThoughts && hasRichWork && suggestions.length === 0) {
      suggestions.push('今日工作内容较丰富，但暂未发现明显缺口；如有需要，可以补充一条最重要的业务判断或风险。');
    }

    return suggestions;
  }

  function renderSuggestions(suggestions) {
    const suggestionSection = document.getElementById('suggestionSection');
    const suggestionList = document.getElementById('suggestionList');

    suggestionList.innerHTML = '';

    if (!suggestions.length) {
      suggestionSection.classList.remove('visible');
      return;
    }

    suggestions.forEach(suggestion => {
      const item = document.createElement('li');
      item.textContent = suggestion;
      suggestionList.appendChild(item);
    });

    suggestionSection.classList.add('visible');
  }

  function formatWork(work) {
    const lines = expandFreeformLines(splitLines(work));
    if (!lines.length) return '';

    const sections = [];
    let currentSection = null;
    let indentLevels = [];
    let state = {};

    function resetSectionState() {
      indentLevels = [];
      state = {
        nodeStack: [],
        currentMainItem: null,
        hasMainItem: false,
        hasSubItem: false,
        usesChineseTopLevel: false
      };
    }

    function addNode(line) {
      const cleanLine = stripListPrefix(line);
      const indentLevel = getIndentLevel(line);
      const level = indentLevel > 0
        ? getIndentedLevel(indentLevel, indentLevels)
        : getFallbackLevel(line, cleanLine, state);
      const node = createNode(line);

      if (level === 0 || !state.nodeStack[level - 1]) {
        currentSection.items.push(node);
      } else {
        state.nodeStack[level - 1].children.push(node);
      }

      state.nodeStack[level] = node;
      state.nodeStack.length = level + 1;
      state.currentMainItem = state.nodeStack[0] || null;
      state.hasMainItem = Boolean(state.nodeStack[0]);
      state.hasSubItem = Boolean(state.nodeStack[1]);
    }

    lines.forEach(line => {
      const cleanLine = stripListPrefix(line);

      if (isModuleLine(cleanLine)) {
        currentSection = { title: cleanLine, items: [] };
        resetSectionState();
        sections.push(currentSection);
        return;
      }

      if (!currentSection) {
        currentSection = { title: '工作内容', items: [] };
        resetSectionState();
        sections.push(currentSection);
      }

      addNode(line);
    });

    function formatNode(node, depth, index) {
      const numberLabels = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
      const alphaLabels = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i'];
      const romanLabels = ['i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii', 'viii', 'ix'];
      const labels = depth === 0 ? numberLabels : depth === 1 ? alphaLabels : romanLabels;
      const indent = depth === 0 ? '' : depth === 1 ? '   ' : '      ';
      const label = labels[index] || labels[labels.length - 1];
      const line = `${indent}${label}. ${formatItem(node.text)}`;
      const children = node.children
        .map((child, childIndex) => formatNode(child, Math.min(depth + 1, 2), childIndex))
        .join('\n');

      return children ? `${line}\n${children}` : line;
    }

    return sections
      .map(section => {
        const items = section.items
          .map((item, index) => formatNode(item, 0, index))
          .join('\n');
        return `${formatSectionTitle(section.title)}\n${items}`;
      })
      .join('\n\n');
  }

  function formatList(title, text) {
    const lines = expandFreeformLines(splitLines(text));
    if (!lines.length) return '';

    const items = lines
      .map((line, index) => `${index + 1}. ${formatItem(line)}`)
      .join('\n');
    return `## ${title}\n${items}`;
  }

  function generate() {
    const work = document.getElementById('input-work').value.trim();
    const plan = document.getElementById('input-plan').value.trim();
    const thoughts = document.getElementById('input-thoughts').value.trim();

    if (!work && !plan) { alert('请至少填写今日工作内容或明日计划'); return; }

    const btn = document.getElementById('btnGenerate');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    btn.disabled = true;
    spinner.style.display = 'block';
    btnText.textContent = '整理中...';

    const outputSection = document.getElementById('outputSection');
    const outputBody = document.getElementById('outputBody');
    const suggestionSection = document.getElementById('suggestionSection');
    outputSection.classList.remove('visible');
    suggestionSection.classList.remove('visible');
    outputBody.textContent = '';

    try {
      rawMd = [
        formatWork(work),
        formatList('明日计划', plan),
        formatList('思考 / 问题', thoughts)
      ].filter(Boolean).join('\n\n');

      outputBody.innerHTML = renderMarkdown(rawMd);
      renderSuggestions(buildSuggestions(work, plan, thoughts));
      outputSection.classList.add('visible');
      outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch(e) {
      rawMd = '';
      outputBody.textContent = `⚠️ ${e.message || '生成失败，请重试'}`;
      outputSection.classList.add('visible');
      outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = '✨ 重新生成';
  }

  function copyMd() {
    if (!rawMd) return;

    const html = renderMarkdown(rawMd);
    const plainText = rawMd;
    const copyPromise = window.ClipboardItem && navigator.clipboard.write
      ? navigator.clipboard.write([
          new window.ClipboardItem({
            'text/html': new Blob([html], { type: 'text/html' }),
            'text/plain': new Blob([plainText], { type: 'text/plain' })
          })
        ])
      : navigator.clipboard.writeText(plainText);

    copyPromise.then(() => {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }).catch(() => {
      navigator.clipboard.writeText(plainText);
    });
  }

  function openTemplateModal() {
    document.getElementById('templateModal').classList.add('visible');
  }

  function closeTemplateModal(event) {
    if (event && !event.target.classList.contains('modal')) return;
    document.getElementById('templateModal').classList.remove('visible');
  }
</script>
</body>
